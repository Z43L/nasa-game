<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App PWA (WebAssembly)</title>
  <style>body { margin: 0; font-family: system-ui, sans-serif; } #app { padding: 16px; }</style>
  <link rel="manifest" href="/lib/app/pwa/manifest.webmanifest">
  <meta name="theme-color" content="#1f2937">
  <link rel="apple-touch-icon" href="/lib/app/pwa/icons/icon-192.png">
  <script src="/lib/app/pwa/registro.js" data-sw="pwa_sw.js"></script>
</head>
<body>
  <div id="app"><p>Cargando…</p></div>
  <script src="../../../lib/ui/puente.js"></script>
  <script>
    // La página completa (incluidas las cabeceras PWA) la genera Lenguaje con pagina_extra().
    (async () => {
      const p = await LgPuente.cargar('pwa_app.wasm');
      p.iniciar();
      document.open();
      document.write(p.texto('vista', 2n));
      document.close();
    })().catch((e) => { document.getElementById('app').textContent = 'Error: ' + e.message; });
  </script>
</body>
</html>
